name: ThodHUB package
on:
  push:
    tags: ['hub-v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ThodProd/ThodHUB
          ref: v0.1.0
          path: .hub-sdk
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - shell: pwsh
        run: ./hub/build.ps1 -HubRoot (Join-Path $PWD '.hub-sdk')
      - uses: actions/upload-artifact@v4
        with:
          name: thodhub-package
          path: artifacts/hub-release/*
      - if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME artifacts/hub-release/* --verify-tag --generate-notes
